<svg xmlns="http://www.w3.org/2000/svg" width="720" height="170" viewBox="0 0 720 170" role="img" aria-label="Dev quote of the day">
  <style>
    .bgrect { fill: #0d1117; stroke: #30363d; }
    .bar { fill: #bc8cff; }
    .mark { fill: #bc8cff; font-size: 54px; font-weight: 800; }
    .q { fill: #e6edf3; font-size: 18px; font-style: italic; }
    .by { fill: #7d8590; font-size: 14px; }
    .hd { fill: #7d8590; font-size: 11px; letter-spacing: 3px; }
    text { font-family: 'JetBrains Mono','IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  </style>
  <rect class="bgrect" x="0.5" y="0.5" width="719" height="169" rx="10"/>
  <rect class="bar" x="0" y="14" width="5" height="142" rx="2"/>
  <text x="694" y="26" text-anchor="end" class="hd">DEV QUOTE OF THE DAY</text>
  <text x="26" y="62" class="mark">“</text><text x="60" y="78" class="q">Programs must be written for people to read, and only</text><text x="60" y="106" class="q">incidentally for machines to execute.</text><text x="694" y="148" text-anchor="end" class="by">— Harold Abelson</text>
</svg>